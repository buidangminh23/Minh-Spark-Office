[package]
name = "minh-spark-office"
version = "0.2.84"
description = "Office 23 desktop workspace"
authors = ["Minh Spark"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
open = "5"
base64 = "0.23"
minisign-verify = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Tauri 2 Linux stack needs glib 0.18, which never received the fix for GHSA-wrw7-89jp-8q8g.
# third_party/README.md explains the copy and when to remove it.
[patch.crates-io]
glib = { path = "third_party/glib" }
