[package]
name = "minh-spark-office"
version = "0.2.39"
description = "Minh Spark Office desktop workspace"
authors = ["Minh Spark"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
open = "5"
base64 = "0.23"
minisign-verify = "0.3"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
subtle = "2"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "io-util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_Graphics_Gdi", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
