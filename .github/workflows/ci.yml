name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Web build
        run: npx vite build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Save verified MOS and template content
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: office-content-v1
          path: dist/content/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish-content:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: office-content-v1
          path: dist/content/
      - name: Publish verified content
        run: bash scripts/publish-office-content.sh dist "$GITHUB_SHA"
